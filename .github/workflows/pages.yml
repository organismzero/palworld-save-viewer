name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# Publishing force-pushes a branch, so this needs write access to the
# repository rather than the `pages`/`id-token` pair the Actions Pages
# pipeline used.
permissions:
  contents: write

# One deploy at a time, and never cancel one in flight: two force-pushes
# racing would leave the live site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # This publishes by force-pushing the build to a `gh-pages` branch rather
  # than through actions/deploy-pages. That action waits on GitHub's
  # deployment queue and hard-caps its own `timeout` input at ten minutes
  # (MAX_TIMEOUT = 600000, `Math.min(timeoutInput, MAX_TIMEOUT)` in
  # src/internal/deployment.js), so when the queue ran long every deploy
  # failed on wait time with a perfectly good artifact and nothing on our
  # side could extend it. Pushing a branch finishes in seconds and never
  # touches that queue.
  #
  # The trade is that branch-based Pages builds do count against the soft
  # limit of 10 builds per hour, which custom workflows are exempt from.
  # That is fine at this repository's deploy rate, but it is the thing to
  # look at first if deploys start being rejected in a busy hour.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `vite.config.ts` defaults `base` to /palworld-save-viewer/, which is
      # what Pages serves this repository from. A user forking under a
      # different name sets VITE_BASE instead of editing the config.
      - run: pnpm build

      # Without this, Pages runs the build through Jekyll, which silently
      # drops files and directories whose names begin with an underscore.
      # Vite does not emit any today, but a future dependency might.
      - run: touch dist/.nojekyll

      # A throwaway repository inside dist, force-pushed as a single orphan
      # commit. The branch therefore holds exactly one revision of the built
      # site rather than accumulating one per deploy, which keeps clones of
      # `main` unaffected and the branch itself at the size of a single build.
      - name: Publish dist to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
