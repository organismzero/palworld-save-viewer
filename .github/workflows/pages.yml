name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-finished deploy
# would leave the live site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `vite.config.ts` defaults `base` to /palworld-save-viewer/, which is
      # what Pages serves this repository from. A user forking under a
      # different name sets VITE_BASE instead of editing the config.
      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Do not add `timeout:` here expecting it to help. The action hard-caps it
      # at MAX_TIMEOUT = 600000 (`Math.min(timeoutInput, MAX_TIMEOUT)` in
      # src/internal/deployment.js), so a larger value is clamped back to ten
      # minutes and only earns a warning in the log. Ten minutes is the ceiling.
      #
      # That matters because the build takes ~30s and everything after it is
      # GitHub holding at `deployment_queued`. When that queue runs long, the
      # deploy fails on wait time with a perfectly good artifact, and there is
      # no knob on our side for it. Re-running does not help either: the
      # deployment record is keyed on the commit and a timed-out one is left
      # cancelled, so a retry reattaches and fails in seconds. Push a new commit
      # or dispatch the workflow to get a fresh deployment.
      - id: deployment
        uses: actions/deploy-pages@v4
